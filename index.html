if(e.target.classList.contains('qf')){const j=+e.target.dataset.j,f=e.target.files[0];if(f)shrink(f,900).then(u=>{const x=collect();x.qs[j].img=u;render()});return}
if(e.target.classList.contains('ty')){const x=collect(),q=x.qs[+e.target.dataset.j],t=e.target.value;if(t!=='sa'&&q.o.length<2){tt('Câu này không có phương án A–D / a–d nên chỉ có thể là Trả lời ngắn');render();return}q.t=t;q.a=t==='mc'?0:t==='tf'?q.o.map(()=>true):'';render();return}
if(e.target.id==='sp'){['pw','pc'].forEach(i=>{const x=$(i);if(x)x.type=e.target.checked?'text':'password'});return}if(e.target.name==='cq'){V.ans[V.cur||0]=+e.target.value;const b=root.querySelector('.tab.cur');if(b)b.classList.add('dn');return}if(e.target.id==='uc'){$('us').innerHTML=CATS[+e.target.value][3].map((x,i)=>`<option value=${i}>${x}</option>`).join('');return}const f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id==='pf')pick(f);if(e.target.id==='nf')handlePdf(f)});
root.addEventListener('input',e=>{if(/^s\d+$/.test(e.target.id)&&V.t&&!V.r){const i=+e.target.id.slice(1);V.ans[i]=e.target.value;const b=root.querySelectorAll('.tab')[i];if(b)b.classList.toggle('dn',!!e.target.value.trim())}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['un','pw','pc'].includes(e.target.id)){const b=root.querySelector('[data-a=go]');if(b)b.click()}});
const GM=(()=>{
const K1='ldd_lb',K2='ldd_pet',XU=15,
PETS={cat:['🐱','Mèo Học Bá'],owl:['🦉','Cú Thức Đêm'],doge:['🐶','Doge Chăm Chỉ'],panda:['🐼','Gấu Trúc Lì Lợm']},
QT={cat:['Meo! Ăn no rồi mới đủ sức giải Hình học không gian 😸','Meo meo~ Đề 8 điểm chưa đủ đâu, mình muốn thấy con 10 cơ!','Cào cào… à nhầm, cào đề thôi! Cố lên chủ nhân ơi 🐾'],
owl:['Hú! Mình thức khuya cùng bạn, nhưng 11 giờ là đi ngủ nhé 🦉','Kiến thức như con mồi: săn mỗi ngày mới béo tốt!','Cú nói nhỏ: sai câu nào, ghi sổ câu đó, ôn lại là ăn điểm!'],
doge:['Wow! Much học, very điểm cao, so giỏi! 🐶','Such đề, much cố gắng, wow! Cho mình ăn thêm nữa đi!','Gâu! Bỏ TikTok xuống, mở đề ra thôi bạn ơi!'],
panda:['Ăn tre xong là học bài… à khoan, học bài xong mới ăn tre! 🐼','Chậm mà chắc, mỗi ngày một đề, thi xong thành thần!','Gấu trúc tin bạn sẽ đỗ nguyện vọng 1, ợ~ 🎋']},
RK=['Tập sự','Chăm chỉ','Học bá','Thần đồng','Huyền thoại'],
need=l=>40+10*l,
lbd=()=>{const a=LS.get(K1,[]);return Array.isArray(a)?a:[]},
all=()=>{const d=LS.get(K2,{});return d&&typeof d==='object'&&!Array.isArray(d)?d:{}},
pd=()=>Object.assign({p:'cat',lv:1,xp:0,fd:0,xu:0,say:''},all()[me]||{}),
sv=p=>{const d=all();d[me]=p;LS.set(K2,d)},
crumb=t=>`<div class=bc><a data-a=home>Kỳ thi</a> › <b>${t}</b></div>`,
rows=f=>{const B={};lbd().forEach(r=>{if((f.c&&r.c!==f.c)||(f.j&&r.j!==f.j)||(f.i&&r.i!==f.i))return;const k=r.u+'|'+r.i,o=B[k];if(!o||r.s>o.s||(r.s===o.s&&r.t<o.t))B[k]=r});return Object.values(B).sort((a,b)=>b.s-a.s||a.t-b.t||a.d-b.d)},
row=(r,i)=>{const n=i+1,m=Math.floor(r.t/60),s=String(r.t%60).padStart(2,'0');return`<div class="gr${n<4?' g'+n:''}${me===r.u?' gme':''}"><div class=gk>${n===1?'<em>👑</em>':''}${n<4?['🥇','🥈','🥉'][i]:n}</div><div><b>${esc(r.u)}${me===r.u?' (bạn)':''}</b><small>${esc(r.c)} › ${esc(r.j)} · ${esc(r.e)}</small></div><div class=gs>${r.s.toFixed(2)}<span>/10</span><small>⏱ ${m}:${s} · ${new Date(r.d).toLocaleDateString('vi-VN')}</small></div></div>`};
return{
nav:()=>V.t&&!V.r?'':`<div class=gn><button class="btn o" data-a=lb title="Bảng xếp hạng">🏆<span class=gt> Xếp hạng</span></button><button class="btn o" data-a=pet title="Góc thú cưng">🐾<span class=gt> Thú cưng</span>${me&&pd().fd?`<b class=gb>${pd().fd}</b>`:''}</button></div>`,
rec(e,sc){try{if(!me)return'';const x=+sc.toFixed(2),c=CATS[e.c]||[],t=Math.max(0,Math.min(e.mins*60,Math.round((Date.now()-V.end)/1e3+e.mins*60))),L=lbd();
L.push({u:me,s:x,i:e.id,e:e.title,c:c[0]||'',j:(c[3]||[])[e.s]||'',t,d:Date.now()});LS.set(K1,L.slice(-500));
const R=rows({i:e.id}),k=R.findIndex(y=>y.u===me)+1;let g;
if(x>=8){const a=x>=10?4:x>=9?3:2,b=Math.round(x*5),p=pd();p.fd+=a;p.xu+=b;sv(p);g=`🎁 Thưởng: +${a} 🍖 thức ăn · +${b} 🪙 xu`}else g='💡 Đạt từ 8.0 điểm để nhận thức ăn cho thú cưng';
return g+(k?` · 🏆 Hạng ${k}/${R.length} của đề này`:'')+' · <a data-a=pet>Đến Góc Thú Cưng</a>'}catch(x){return''}},
lbV(){const c=V.fc||'',j=V.fs||'',R=rows({c,j}).slice(0,20),js=[...new Set(CATS.filter(x=>!c||x[0]===c).flatMap(x=>x[3]))],o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
return`<div class=w>${crumb('Bảng xếp hạng')}<h2>🏆 Bảng xếp hạng</h2><p class=sub>Mỗi bạn chỉ tính điểm cao nhất ở mỗi đề; bằng điểm thì ai nộp nhanh hơn xếp trên.</p><div class=gf><label>Kỳ thi<select id=lbc><option value="">Tất cả kỳ thi</option>${o(CATS.map(x=>x[0]),c)}</select></label><label>Môn học<select id=lbs><option value="">Tất cả môn</option>${o(js,j)}</select></label></div>${R.length?R.map(row).join(''):'<p class=empty>Chưa có kết quả nào ở mục này — hoàn thành một đề để lên bảng nhé!</p>'}</div>`},
petV(){if(!me)return`<div class=w>${crumb('Góc thú cưng')}<h2>🐾 Góc Thú Cưng</h2><div class=empty><p>Đăng nhập để nhận linh vật và nuôi bằng điểm số của bạn.</p><button class=btn data-a=li>Đăng nhập</button></div></div>`;
const p=pd(),n=need(p.lv),P=PETS[p.p]||PETS.cat,fx=V.fx;V.fx=0;
return`<div class=w>${crumb('Góc thú cưng')}<h2>🐾 Góc Thú Cưng</h2><p class=sub>Đạt từ 8.0 điểm ở một đề để nhận thức ăn và xu, rồi cho linh vật ăn để lên cấp.</p><div class=gpg><div class=gpc><div class="gpe${fx?' bump':''}">${P[0]}</div><h3>${P[1]}</h3><b>Cấp ${p.lv} · ${RK[Math.min(4,(p.lv-1)>>1)]}</b><div class=gxp><i style="width:${Math.round(p.xp/n*100)}%"></i></div><small class=sub>${p.xp}/${n} KN</small><div class=gsy>${esc(p.say||'Chào bạn! Làm đề đạt từ 8.0 điểm để có thức ăn cho mình nhé 🍖')}</div><div class=gst><b>🍖 ${p.fd}</b><b>🪙 ${p.xu}</b></div><div class="bt gc"><button class=btn data-a=feed ${p.fd?'':'disabled'}>🍖 Cho ăn</button><button class="btn o" data-a=buy ${p.xu>=XU?'':'disabled'}>Đổi ${XU} 🪙 lấy 1 🍖</button></div></div><div><h3 class=zg>Chọn linh vật</h3><div class=gpp>${Object.entries(PETS).map(([k,v])=>`<button class="gpo${k===p.p?' on':''}" data-a=pp data-id=${k}><span>${v[0]}</span>${v[1]}</button>`).join('')}</div></div></div></div>`},
pick(k){if(!me||!PETS[k])return;const p=pd();p.p=k;p.say=`Xin chào! Mình là ${PETS[k][1]}, từ nay mình cùng bạn ôn thi nhé!`;V.fx=1;sv(p)},
feed(){if(!me)return;const p=pd();if(p.fd<1){p.say='Hết thức ăn rồi! Đạt từ 8.0 điểm ở một đề để kiếm thêm nhé 🍖';sv(p);return}p.fd--;p.xp+=10;let up=0;while(p.xp>=need(p.lv)){p.xp-=need(p.lv);p.lv++;up=1}const Q=QT[p.p]||QT.cat;p.say=(up?`🎉 Lên cấp ${p.lv}! `:'✨ +10 KN · ')+Q[Math.random()*Q.length|0];V.fx=1;sv(p)},
buy(){if(!me)return;const p=pd();if(p.xu<XU)return;p.xu-=XU;p.fd++;p.say='Cảm ơn bạn đã đổi thức ăn cho mình! Nom nom 😋';sv(p)}}})();
root.addEventListener('change',e=>{const t=e.target;if(t.id==='lbc'){V.fc=t.value;V.fs='';render()}else if(t.id==='lbs'){V.fs=t.value;render()}});
render();
</script>
</body></html>
