function scanBands(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,counts=new Uint32Array(h),step=2;for(let y=0;y<h;y+=step){let n=0;for(let x=Math.floor(w*.025);x<w*.975;x+=step){const k=(y*w+x)*4;if(d[k]<232&&d[k+1]<232&&d[k+2]<232)n++}counts[y]=n}const threshold=Math.max(2,Math.floor(w*.0012/step)),gap=Math.max(18,Math.floor(h*.008)),blocks=[];let a=-1,last=-1;for(let y=0;y<h;y+=step){if(counts[y]>threshold){if(a<0)a=y;last=y}else if(a>=0&&y-last>gap){if(last-a>Math.max(24,h*.012))blocks.push([a,last]);a=-1}}if(a>=0&&last-a>Math.max(24,h*.012))blocks.push([a,last]);if(!blocks.length)return[[0,h-1]];const merged=[];for(const b of blocks){const z=merged[merged.length-1];if(z&&b[0]-z[1]<gap*1.8)z[1]=b[1];else merged.push(b.slice())}return merged.length?merged:[[0,h-1]]}
function questionFromImage(url,n){return{n,t:'mc',q:'',o:['A','B','C','D'],a:-1,img:url}}
async function importImage(file,say){const raw=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const im=await imageFromUrl(raw);const scale=Math.min(1,1600/im.width);const c=makeCanvas(im.width*scale,im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const page={url:c.toDataURL('image/jpeg',.9),w:c.width,h:c.height};const bands=scanBands(c);let qs=[];bands.forEach(([y0,y1])=>{let top=Math.max(0,y0-12),bottom=Math.min(c.height,y1+14);if(bottom-top>28){const part=makeCanvas(c.width,bottom-top);part.getContext('2d').drawImage(c,0,top,c.width,bottom-top,0,0,part.width,part.height);qs.push(questionFromImage(canvasUrl(part),qs.length+1))}});if(!qs.length)qs=[questionFromImage(canvasUrl(c),1)];return{pages:[page],qs}}
function questionAnchors(items){const rows=[];for(const it of items||[]){if(!it.str||!it.str.trim()||!it.transform)continue;const y=it.transform[5],x=it.transform[4],h=it.height||10;let row=rows.find(r=>Math.abs(r.y-y)<3.2);if(!row){row={y,h,parts:[]};rows.push(row)}row.parts.push({x,s:it.str});row.h=Math.max(row.h,h)}rows.sort((a,b)=>b.y-a.y);let answerSection=false,stop=null;const out=[];for(const r of rows){const txt=r.parts.sort((a,b)=>a.x-b.x).map(a=>a.s).join(' ').replace(/\s+/g,' ').trim();if(/^(?:bảng\s+)?đáp\s*án(?:\s+(?:phần|đề)\s+[ivx0-9]+)?\s*:?$|^hướng dẫn giải\s*:?$|^lời giải\s*:?$/i.test(txt)){answerSection=true;stop={y:r.y};continue}if(answerSection)continue;const m=txt.match(/(?:^|\s)(?:câu|cau)\s*(\d{1,3})\s*[.):\-]?/i);if(m)out.push({y:r.y,h:r.h,n:+m[1]})}return{anchors:out,stop}}
async function pdfPages(file,say){const U='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';if(!window.pdfjsLib)await loadJS(U+'pdf.min.js');if(!pdfjsLib.GlobalWorkerOptions.workerSrc)pdfjsLib.GlobalWorkerOptions.workerSrc=U+'pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[],anchors=[];for(let i=1;i<=doc.numPages;i++){say(`Đang xử lý trang PDF ${i}/${doc.numPages}…`);const p=await doc.getPage(i),items=await p.getTextContent(),found=questionAnchors(items.items);if(!anchors.answerStop)found.anchors.forEach(a=>anchors.push({...a,p:i-1}));if(found.stop&&!anchors.answerStop)anchors.answerStop={...found.stop,p:i-1};const base=p.getViewport({scale:1}),scale=Math.min(1.55,1450/base.width),vp=p.getViewport({scale}),cv=makeCanvas(vp.width,vp.height),g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);await p.render({canvasContext:g,viewport:vp}).promise;pages.push({url:cv.toDataURL('image/jpeg',.9),w:cv.width,h:cv.height,scale,view:p.view.slice()});cv.width=1;cv.height=1;p.cleanup()}anchors.sort((a,b)=>a.p-b.p||b.y-a.y);const answerStop=anchors.answerStop||null;return{doc,pages,anchors,answerStop}}
const PDF_PAGE_CANVAS=new Map();async function pdfPageCanvas(meta,index){if(PDF_PAGE_CANVAS.has(index))return PDF_PAGE_CANVAS.get(index);const c=await imageFromUrl(meta.url);PDF_PAGE_CANVAS.set(index,c);if(PDF_PAGE_CANVAS.size>3)PDF_PAGE_CANVAS.delete(PDF_PAGE_CANVAS.keys().next().value);return c}
async function cropPdfQuestion(pdf,sourcePages,anchors,index,answerStop=null){const cur=anchors[index],next=anchors[index+1]||null,boundary=next||answerStop,segs=[],first=cur.p,last=boundary?boundary.p:sourcePages.length-1;for(let pi=first;pi<=last;pi++){const meta=sourcePages[pi],p=await pdf.getPage(pi+1),vp=p.getViewport({scale:meta.scale}),v=p.view,curTop=pi===first?Math.min(v[3]-4,cur.y+(cur.h||10)*1.5+12):v[3]-12,bot=pi===last&&boundary?Math.max(v[1]+6,boundary.y-12):v[1]+12;let yTop=curTop,yBottom=bot;if(yTop-yBottom<25){p.cleanup();continue}const rect=vp.convertToViewportRectangle([v[0]+8,yBottom,v[2]-8,yTop]),x=Math.max(0,Math.floor(Math.min(rect[0],rect[2]))),y=Math.max(0,Math.floor(Math.min(rect[1],rect[3]))),w=Math.min(meta.w-x,Math.ceil(Math.abs(rect[2]-rect[0]))),h=Math.min(meta.h-y,Math.ceil(Math.abs(rect[3]-rect[1])));p.cleanup();if(w<5||h<5)continue;const pageCanvas=await pdfPageCanvas(meta,pi),part=makeCanvas(w,h);part.getContext('2d').drawImage(pageCanvas,x,y,w,h,0,0,w,h);segs.push(part)}if(!segs.length)return null;const maxW=Math.max(...segs.map(x=>x.width)),totalH=segs.reduce((n,x)=>n+Math.round(x.height*maxW/x.width),0),joined=makeCanvas(maxW,totalH);let yy=0;for(const part of segs){const hh=Math.round(part.height*maxW/part.width);joined.getContext('2d').drawImage(part,0,0,part.width,part.height,0,yy,maxW,hh);yy+=hh}return canvasUrl(joined)}
async function importPdf(file,say){const X=await pdfPages(file,say),qs=[];if(X.anchors.length){for(let i=0;i<X.anchors.length;i++){say(`Đang tự cắt câu ${i+1}/${X.anchors.length}…`);const img=await cropPdfQuestion(X.doc,X.pages,X.anchors,i,X.answerStop);if(img)qs.push(questionFromImage(img,qs.length+1))}}else{say('PDF dạng ảnh: đang tìm các vùng nội dung theo khoảng trắng…');for(let pi=0;pi<X.pages.length;pi++){const c=await imageFromUrl(X.pages[pi].url),bands=scanBands(c);for(const [y0,y1] of bands){const top=Math.max(0,y0-14),bottom=Math.min(c.height,y1+16);if(bottom-top<28)continue;const part=makeCanvas(c.width,bottom-top);part.getContext('2d').drawImage(c,0,top,c.width,bottom-top,0,0,part.width,part.height);qs.push(questionFromImage(canvasUrl(part),qs.length+1))}}}if(!qs.length){for(let pi=0;pi<X.pages.length;pi++){const c=await imageFromUrl(X.pages[pi].url);qs.push(questionFromImage(canvasUrl(c),qs.length+1))}}try{await X.doc.destroy()}catch(e){}PDF_PAGE_CANVAS.clear();return{pages:X.pages,qs}}
async function handleFiles(files){const list=[...files||[]];if(!list.length)return;DR=DR||{qs:[],pages:[],cropMode:false,cropPage:0,rect:null};const say=m=>{const el=$('ps');if(el)el.textContent=m};try{let added=0;for(const f of list){if(!$('nt')?.value)$('nt').value=f.name.replace(/\.(pdf|png|jpe?g|webp|bmp)$/i,'');say(`Đang đọc ${f.name}…`);const result=/\.pdf$/i.test(f.name)||f.type==='application/pdf'?await importPdf(f,say):(f.type.startsWith('image/')||/\.(png|jpe?g|webp|bmp|gif)$/i.test(f.name))?await importImage(f,say):null;if(!result){tt('Tệp không được hỗ trợ: '+f.name);continue}const offset=DR.pages.length;DR.pages.push(...result.pages);result.qs.forEach(q=>{q.n=DR.qs.length+1;DR.qs.push(q)});added+=result.qs.length}DR.cropPage=Math.min(DR.cropPage,Math.max(0,DR.pages.length-1));DR.rect=null;render();const missing=DR.qs.filter(q=>q.a<0).length;say(`✔ Đã tự cắt ${added} vùng câu hỏi. Có ${DR.qs.length} câu trong bản nháp; chọn đáp án đúng A–D rồi lưu đề. ${missing} câu cần chọn đáp án.`)}catch(e){say('Không xử lý được tệp: '+(e.message||e));tt('Có lỗi khi đọc tệp. Hãy thử PDF hoặc ảnh rõ nét hơn.')}}
