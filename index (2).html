<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thăm Ngàn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='23' height='26' rx='4' fill='%232a3fa8'/%3E%3Cpath d='M10 8v16' stroke='white' stroke-width='2' stroke-dasharray='1.2 4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M15 12h9M19.5 12v10' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#161a2e;--mu:#667089;--bd:#dfe3ee;--ac:#2a3fa8;--ak:#fff;--as:#e8ecfb;--ok:#0d8a5e;--no:#c9303c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1018;--sf:#151926;--tx:#e8ebf5;--mu:#9199b0;--bd:#262c3d;--ac:#93a5ff;--ak:#0d1018;--as:#1c2240;--ok:#3fd09b;--no:#ff7d88;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:20px 18px 90px}
h2{font-size:1.6rem;letter-spacing:-.02em;margin:8px 0 16px;line-height:1.25}h3{font-size:1.05rem;margin:28px 0 10px}p{margin:0}
small,.mu{color:var(--mu)}small{font-size:.86rem}
.top{display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.2rem;letter-spacing:-.02em;cursor:pointer}
.brand:before{content:"";width:14px;height:20px;border-radius:4px;border:2px dashed var(--ac)}
nav{display:flex;gap:4px}nav button{border:0;background:none;color:var(--mu);font:inherit;padding:6px 13px;border-radius:9px;cursor:pointer}
nav button.on{color:var(--ac);background:var(--as);font-weight:600}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;transition:transform .12s,background .15s}
.btn:hover{background:var(--as)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;pointer-events:none}
.pri{background:var(--ac);color:var(--ak);border-color:var(--ac)}.pri:hover{background:var(--ac);filter:brightness(1.12)}
.sm{padding:5px 11px;font-size:.88rem;font-weight:500}.dg{color:var(--no)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=number],input[type=password]{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx)}
.list,.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px}.card{padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.row>div{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis}.row>b{font-size:1.25rem}
.empty,.hint{padding:28px 16px;text-align:center;color:var(--mu)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fld label{display:grid;gap:4px;font-size:.86rem;color:var(--mu)}.fld .g{flex:1;min-width:200px}
.q{background:var(--sf);border:1px solid var(--bd);border-left:4px dashed var(--bd);border-radius:14px;padding:16px;margin:0 0 16px;scroll-margin-top:120px;transition:border-color .2s}
.q.done{border-left:4px solid var(--ac)}.q.ok{border-left:4px solid var(--ok)}.q.no{border-left:4px solid var(--no)}
.qn{font-weight:600;margin-bottom:10px}
.qi{display:block;max-width:100%;height:auto;margin:0 auto 14px;background:#fff;border-radius:8px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.o{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
button.o:hover{border-color:var(--ac)}.o.on{background:var(--ac);border-color:var(--ac);color:var(--ak);transform:scale(1.07)}
.o.good{background:var(--ok);border-color:var(--ok);color:#fff}.o.bad{background:var(--no);border-color:var(--no);color:#fff}
span.o{cursor:default}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 8px;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px}.hd b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem}.tm.low{color:var(--no)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;min-width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font:inherit;font-size:.86rem;cursor:pointer}
.chip.done{background:var(--as);color:var(--ac);border-color:var(--ac)}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 20px}.score b{font-size:3.4rem;letter-spacing:-.04em;line-height:1}
.view{max-height:72vh;overflow:auto;padding-right:26px;border:1px dashed var(--bd);border-radius:12px;margin-top:12px;background:var(--bg)}
.stage{position:relative;line-height:0;cursor:crosshair;touch-action:none;user-select:none}.stage canvas{width:100%;display:block}
.sel{position:absolute;display:none;pointer-events:none;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);max-width:90vw;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <b class="brand" data-a="home">Thăm Ngàn</b>
  <nav><button id="n-home" data-a="home">Làm bài</button><button id="n-admin" data-a="admin">Quản trị</button></nav>
</header>
<main id="app"></main>
<input type="file" id="f" accept="image/*,application/pdf" multiple hidden>
<div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app'),O=[...'ABCD'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=n=>n.toLocaleString('vi-VN',{maximumFractionDigits:2});
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let tmo;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tmo);tmo=setTimeout(()=>t.classList.remove('on'),2800)};

/* ===== Lưu trữ: IndexedDB (đề, ảnh, kết quả) + localStorage (PIN, bài đang làm) ===== */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('thamngan-v2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('exams',{keyPath:'id'});r.result.createObjectStore('results',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q.result);t.onerror=t.onabort=()=>no(t.error)}));
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
navigator.storage?.persist?.();

let tick,admin=false,cur=null,run=null,X=null,pdf=null,pg=1,sel=null;
const nav=k=>['home','admin'].forEach(x=>$('#n-'+x).classList.toggle('on',x===k));
const keep=()=>{try{localStorage.setItem('tn_run',JSON.stringify(run))}catch(e){}};
const drop=()=>{run=null;try{localStorage.removeItem('tn_run')}catch(e){}};

/* ===== Hành động (nút có data-a) ===== */
const A={
 home(){scrollTo(0,0);viewHome()},
 admin(){scrollTo(0,0);viewAdmin()},
 async start(d){const e=await get('exams',d.id);if(!e||!e.qs.length)return toast('Đề này chưa có câu hỏi.');if(run&&!confirm('Bạn đang làm dở một bài. Bỏ bài đó và làm đề mới?'))return;begin(e)},
 async resume(){const e=await get('exams',run.eid);if(!e){drop();return viewHome()}begin(e,run)},
 pick(d){const s=document.querySelector(`section[data-q="${d.q}"]`);run.ans[d.q]===d.c?delete run.ans[d.q]:run.ans[d.q]=d.c;const v=run.ans[d.q];
  s.querySelectorAll('.o').forEach(b=>{b.classList.toggle('on',b.dataset.c===v);b.setAttribute('aria-pressed',b.dataset.c===v)});
  s.classList.toggle('done',!!v);document.querySelector(`.chip[data-i="${s.id.slice(1)}"]`).classList.toggle('done',!!v);keep()},
 jump(d){document.getElementById('q'+d.i).scrollIntoView({behavior:'smooth',block:'start'})},
 submit(){submit()},
 async review(d){const r=await get('results',d.id),e=await get('exams',r.eid);showResult(e,r)},
 pin(){const v=$('#pin').value,p=localStorage.getItem('tn_pin');if(!v)return;if(!p)localStorage.setItem('tn_pin',v);else if(v!==p)return toast('Sai mã PIN.');admin=true;viewAdmin()},
 new(){editor({id:uid(),title:'',min:60,qs:[],at:Date.now()})},
 async edit(d){editor(await get('exams',d.id))},
 async rm(d){if(confirm('Xóa đề này? Không thể hoàn tác.')){await del('exams',d.id);viewAdmin()}},
 async exp(d){const e=await get('exams',d.id),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'thamngan',v:1,exam:e})],{type:'application/json'}));a.download=(e.title.replace(/[\\/:*?"<>|]+/g,'').trim()||'de-thi')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
 imp(){$('#imf').click()},
 pickf(){$('#f').click()},
 async pp(d){const n=pg+ +d.d;if(pdf&&n>=1&&n<=pdf.numPages){pg=n;await showPg()}},
 crop(){const c=$('#cv');if($('#stg').hidden)return toast('Hãy chọn ảnh hoặc PDF trước.');if(!sel)return toast('Kéo chuột chọn vùng chứa câu hỏi trước.');
  const r=c.getBoundingClientRect(),k=c.width/r.width,o=document.createElement('canvas');o.width=Math.round(sel.w*k);o.height=Math.round(sel.h*k);
  o.getContext('2d').drawImage(c,sel.x*k,sel.y*k,sel.w*k,sel.h*k,0,0,o.width,o.height);add(finish(o));sel=null;$('#sl').style.display='none'},
 whole(){if($('#stg').hidden)return toast('Hãy chọn ảnh hoặc PDF trước.');add(finish($('#cv')))},
 mv(d){const i=+d.i,j=i+ +d.d;[cur.qs[i],cur.qs[j]]=[cur.qs[j],cur.qs[i]];renderQs()},
 rq(d){cur.qs.splice(+d.i,1);renderQs()},
 key(d,b){const q=cur.qs[+d.i];q.ans=q.ans===d.c?'':d.c;const s=b.closest('section');s.classList.toggle('done',!!q.ans);s.querySelectorAll('.o').forEach(x=>x.classList.toggle('on',x.dataset.c===q.ans))},
 async save(){cur.title=cur.title.trim();if(!cur.title)return toast('Hãy nhập tên đề.');if(!cur.qs.length)return toast('Đề chưa có câu hỏi nào.');
  const m=cur.qs.filter(q=>!q.ans).length;if(m)return toast(`Còn ${m} câu chưa chọn đáp án đúng.`);cur.at=Date.now();
  try{await put('exams',cur);toast('Đã lưu đề.');viewAdmin()}catch(e){toast('Không lưu được: bộ nhớ trình duyệt đầy hoặc bị chặn.')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')A.pin()});

/* ===== Người làm bài ===== */
async function viewHome(){
 nav('home');clearInterval(tick);
 const [ex,rs]=await Promise.all([all('exams'),all('results')]);
 ex.sort((a,b)=>b.at-a.at);rs.sort((a,b)=>b.at-a.at);
 app.innerHTML=(run?`<div class="card tb"><div style="flex:1"><b>Bạn đang làm dở một bài</b><br><small>Thời gian còn lại ${fmt(Math.ceil((run.end-Date.now())/1000))}</small></div><button class="btn pri" data-a="resume">Tiếp tục</button></div>`:'')
 +`<h2>Chọn đề để làm bài</h2><div class="list">`+(ex.length?ex.map(e=>`<div class="row"><div><b>${esc(e.title)}</b><small>${e.qs.length} câu, ${e.min} phút</small></div><button class="btn pri" data-a="start" data-id="${e.id}">Làm bài</button></div>`).join(''):`<div class="empty">Chưa có đề nào. Vào mục Quản trị để tạo đề hoặc nhập file đề.</div>`)+`</div>`
 +(rs.length?`<h3>Kết quả gần đây</h3><div class="list">`+rs.slice(0,10).map(r=>`<div class="row"><div><b>${esc(r.title)}</b><small>${new Date(r.at).toLocaleString('vi-VN')}, ${r.ok}/${r.n} câu đúng</small></div><b>${num(r.score)}</b>${ex.some(e=>e.id===r.eid)?`<button class="btn sm" data-a="review" data-id="${r.id}">Xem lại</button>`:''}</div>`).join('')+`</div>`:'');
}
function begin(e,s){
 X=e;run=s||{eid:e.id,t0:Date.now(),end:Date.now()+e.min*60000,ans:{}};keep();nav('home');scrollTo(0,0);
 app.innerHTML=`<div class="bar"><div class="hd"><b>${esc(e.title)}</b><span class="tm" id="tm"></span><button class="btn pri sm" data-a="submit">Nộp bài</button></div><div class="chips">`
 +e.qs.map((q,i)=>`<button class="chip${run.ans[q.id]?' done':''}" data-a="jump" data-i="${i}">${i+1}</button>`).join('')+`</div></div>`
 +e.qs.map((q,i)=>`<section class="q${run.ans[q.id]?' done':''}" id="q${i}" data-q="${q.id}"><div class="qn">Câu ${i+1}</div><img class="qi" src="${q.img}" alt="Câu ${i+1}"><div class="opts">${O.map(c=>`<button class="o${run.ans[q.id]===c?' on':''}" data-a="pick" data-q="${q.id}" data-c="${c}" aria-pressed="${run.ans[q.id]===c}">${c}</button>`).join('')}</div></section>`).join('');
 clearInterval(tick);tick=setInterval(clock,500);clock();
}
function clock(){const t=$('#tm');if(!t||!run)return;const s=Math.ceil((run.end-Date.now())/1000);t.textContent=fmt(s);t.classList.toggle('low',s<=60);if(s<=0){toast('Hết giờ, bài làm đã được nộp tự động.');submit(true)}}
async function submit(force){
 if(!run||!X)return;
 const un=X.qs.filter(q=>!run.ans[q.id]).length;
 if(!force&&un&&!confirm(`Còn ${un} câu chưa làm. Vẫn nộp bài?`))return;
 clearInterval(tick);
 const n=X.qs.length,ok=X.qs.filter(q=>run.ans[q.id]===q.ans).length;
 const r={id:uid(),eid:X.id,title:X.title,at:Date.now(),n,ok,score:Math.round(ok/n*1000)/100,secs:Math.min(Math.round((Date.now()-run.t0)/1000),X.min*60),ans:run.ans};
 try{await put('results',r)}catch(e){toast('Không lưu được kết quả vào trình duyệt.')}
 drop();showResult(X,r);
}
function showResult(e,r){
 nav('home');scrollTo(0,0);
 app.innerHTML=`<h2>${esc(e.title)}</h2><div class="score"><b>${num(r.score)}<small>/10</small></b><span>${r.ok}/${r.n} câu đúng, thời gian ${fmt(r.secs)}</span></div><div class="tb"><button class="btn pri" data-a="start" data-id="${e.id}">Làm lại</button><button class="btn" data-a="home">Về trang chủ</button></div><h3>Đáp án chi tiết</h3>`
 +e.qs.map((q,i)=>{const c=r.ans[q.id];return `<section class="q ${c===q.ans?'ok':'no'}"><div class="qn">Câu ${i+1}: ${c?(c===q.ans?'đúng':'sai'):'chưa làm'}</div><img class="qi" src="${q.img}" alt=""><div class="opts">${O.map(k=>`<span class="o${k===q.ans?' good':k===c?' bad':''}">${k}</span>`).join('')}</div></section>`}).join('');
}

/* ===== Quản trị ===== */
async function viewAdmin(){
 nav('admin');clearInterval(tick);
 if(!admin){const has=localStorage.getItem('tn_pin');
  app.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h3 style="margin-top:0">${has?'Nhập mã PIN quản trị':'Đặt mã PIN quản trị'}</h3>${has?'':'<p class="mu" style="margin-bottom:10px">Mã này chỉ khóa giao diện quản trị trên trình duyệt này.</p>'}<div class="tb"><input type="password" id="pin" placeholder="Mã PIN" autocomplete="off"><button class="btn pri" data-a="pin">${has?'Vào quản trị':'Lưu mã'}</button></div></div>`;
  return $('#pin').focus()}
 const ex=await all('exams');ex.sort((a,b)=>b.at-a.at);
 app.innerHTML=`<h2>Quản trị đề thi</h2><div class="tb" style="margin-bottom:16px"><button class="btn pri" data-a="new">Tạo đề mới</button><button class="btn" data-a="imp">Nhập file đề (.json)</button><input type="file" id="imf" accept=".json,application/json" hidden></div><div class="list">`
 +(ex.length?ex.map(e=>`<div class="row"><div><b>${esc(e.title)}</b><small>${e.qs.length} câu, ${e.min} phút</small></div><button class="btn sm" data-a="edit" data-id="${e.id}">Sửa</button><button class="btn sm" data-a="exp" data-id="${e.id}">Xuất</button><button class="btn sm dg" data-a="rm" data-id="${e.id}">Xóa</button></div>`).join(''):`<div class="empty">Chưa có đề nào. Bấm “Tạo đề mới” để bắt đầu.</div>`)+`</div>`;
 $('#imf').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text()),e=j.exam||j;
  const qs=(e.qs||[]).filter(q=>/^data:image\//.test(q.img)&&/^[A-D]$/.test(q.ans)).map(q=>({id:uid(),img:q.img,ans:q.ans}));if(!qs.length)throw 0;
  await put('exams',{id:uid(),title:String(e.title||'Đề nhập vào').slice(0,120),min:Math.max(1,+e.min||60),qs,at:Date.now()});toast('Đã nhập đề.');viewAdmin()}catch(x){toast('File đề không hợp lệ.')}};
}
function editor(e){
 cur=e;pdf=null;sel=null;scrollTo(0,0);
 app.innerHTML=`<h2>${e.title?'Sửa đề':'Tạo đề mới'}</h2>
 <div class="card"><div class="fld"><label class="g">Tên đề<input type="text" id="ti" value="${esc(e.title)}" placeholder="Ví dụ: Đề thi thử Toán số 1"></label><label>Thời gian (phút)<input type="number" id="mi" min="1" value="${e.min}" style="width:120px"></label></div></div>
 <div class="card"><b>Thêm câu hỏi từ ảnh hoặc PDF</b><p class="mu">Tải file đề lên, kéo chuột chọn vùng chứa một câu hỏi rồi bấm “Cắt thành câu hỏi”. Có thể dán ảnh chụp màn hình bằng Ctrl+V hoặc kéo thả file vào khung. Chọn nhiều ảnh cùng lúc để thêm mỗi ảnh thành một câu.</p>
 <div class="tb" style="margin-top:12px"><button class="btn" data-a="pickf">Chọn ảnh / PDF</button><span id="pgc" class="tb" hidden><button class="btn sm" data-a="pp" data-d="-1" aria-label="Trang trước">‹</button><small id="pgl"></small><button class="btn sm" data-a="pp" data-d="1" aria-label="Trang sau">›</button></span><span style="flex:1"></span><button class="btn" data-a="whole">Dùng cả ảnh</button><button class="btn pri" data-a="crop">Cắt thành câu hỏi</button></div>
 <div class="view"><div class="stage" id="stg" hidden><canvas id="cv" width="1" height="1"></canvas><div class="sel" id="sl"></div></div><div class="hint" id="hn">Chưa có file. Chọn ảnh/PDF, kéo thả vào đây hoặc dán ảnh (Ctrl+V).</div></div></div>
 <h3>Câu hỏi (<span id="cnt"></span>)</h3><p class="mu" style="margin-bottom:12px">Bấm A, B, C hoặc D dưới mỗi ảnh để chọn đáp án đúng.</p><div id="ql"></div>
 <div class="tb"><button class="btn pri" data-a="save">Lưu đề</button><button class="btn" data-a="admin">Quay lại</button></div>`;
 $('#ti').oninput=ev=>cur.title=ev.target.value;$('#mi').oninput=ev=>cur.min=Math.max(1,+ev.target.value||1);
 const st=$('#stg'),cv=$('#cv'),sl=$('#sl');let o=null;
 st.onpointerdown=ev=>{const r=cv.getBoundingClientRect();o={x:ev.clientX-r.left,y:ev.clientY-r.top};sel=null;sl.style.display='none';st.setPointerCapture(ev.pointerId)};
 st.onpointermove=ev=>{if(!o)return;const r=cv.getBoundingClientRect(),x=Math.min(Math.max(ev.clientX-r.left,0),r.width),y=Math.min(Math.max(ev.clientY-r.top,0),r.height);
  sel={x:Math.min(o.x,x),y:Math.min(o.y,y),w:Math.abs(x-o.x),h:Math.abs(y-o.y)};Object.assign(sl.style,{display:'block',left:sel.x+'px',top:sel.y+'px',width:sel.w+'px',height:sel.h+'px'})};
 st.onpointerup=()=>{o=null;if(sel&&(sel.w<8||sel.h<8)){sel=null;sl.style.display='none'}};
 renderQs();
}
function renderQs(){
 $('#cnt').textContent=cur.qs.length;const n=cur.qs.length;
 $('#ql').innerHTML=n?cur.qs.map((q,i)=>`<section class="q${q.ans?' done':''}"><div class="qn tb"><span style="flex:1">Câu ${i+1}</span><button class="btn sm" data-a="mv" data-i="${i}" data-d="-1" aria-label="Chuyển lên" ${i?'':'disabled'}>↑</button><button class="btn sm" data-a="mv" data-i="${i}" data-d="1" aria-label="Chuyển xuống" ${i<n-1?'':'disabled'}>↓</button><button class="btn sm dg" data-a="rq" data-i="${i}">Xóa</button></div><img class="qi" src="${q.img}" alt=""><div class="opts">${O.map(c=>`<button class="o${q.ans===c?' on':''}" data-a="key" data-i="${i}" data-c="${c}">${c}</button>`).join('')}</div></section>`).join(''):`<div class="empty card">Chưa có câu hỏi nào.</div>`;
}
const add=img=>{cur.qs.push({id:uid(),img,ans:''});renderQs();toast(`Đã thêm câu ${cur.qs.length}. Hãy chọn đáp án đúng bên dưới.`)};

/* ===== Xử lý ảnh: cắt vùng, bỏ viền trắng, nén JPEG ===== */
const white=b=>{const c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0);return c};
function trim(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let t=h,b=-1,l=w,r=-1;
 for(let y=0;y<h;y++)for(let i=0;i<w;i++){const p=(y*w+i)*4;if(d[p]<235||d[p+1]<235||d[p+2]<235){if(y<t)t=y;if(y>b)b=y;if(i<l)l=i;if(i>r)r=i}}
 if(b<0)return c;const g=10,X0=Math.max(0,l-g),Y0=Math.max(0,t-g),W=Math.min(w,r+g)-X0,H=Math.min(h,b+g)-Y0,o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').drawImage(c,X0,Y0,W,H,0,0,W,H);return o}
function finish(c){c=trim(c);const k=Math.min(1,1400/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/jpeg',.88)}
function ready(){$('#stg').hidden=false;$('#hn').hidden=true;sel=null;$('#sl').style.display='none';$('#pgc').hidden=!pdf}

/* PDF: chỉ tải thư viện PDF.js (cdnjs) khi quản trị viên chọn file PDF */
const pdfjs=()=>window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script'),B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';s.src=B+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';ok()};s.onerror=()=>no(new Error('Không tải được bộ đọc PDF (cần kết nối mạng). Hãy dùng ảnh chụp trang.'));document.head.appendChild(s)});
async function loadPdf(f){await pdfjs();pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;pg=1;await showPg()}
async function showPg(){const p=await pdf.getPage(pg),v=p.getViewport({scale:2}),c=$('#cv');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;ready();$('#pgl').textContent=`Trang ${pg}/${pdf.numPages}`}
async function load(files){
 files=[...files];if(!files.length||!$('#stg'))return;
 const p=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
 try{
  if(p)await loadPdf(p);
  else if(files.length>1)for(const f of files)add(finish(white(await createImageBitmap(f))));
  else{const c=white(await createImageBitmap(files[0])),v=$('#cv');pdf=null;v.width=c.width;v.height=c.height;v.getContext('2d').drawImage(c,0,0);ready()}
 }catch(err){toast(err.message||'Không đọc được file này.')}
}
$('#f').onchange=e=>{load(e.target.files);e.target.value=''};
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length&&$('#stg')){e.preventDefault();load(f)}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files)});

/* ===== Khởi động ===== */
try{run=JSON.parse(localStorage.getItem('tn_run'))}catch(e){run=null}
(run?A.resume():viewHome()).catch?.(()=>{app.innerHTML='<div class="empty">Trình duyệt đang chặn bộ nhớ IndexedDB. Hãy tắt chế độ ẩn danh hoặc cho phép lưu dữ liệu trang web.</div>'});
</script>
